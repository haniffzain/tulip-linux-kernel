<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="760" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc">
  <title id="title">Linux 7.3 Tulip — Tux with a bouquet of tulips</title>
  <desc id="desc">Tux remains a penguin and holds a bouquet of tulips on the left, while separate tulip growth stages represent Tulip policy, configuration, validation, engineering and testing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ebff"/>
      <stop offset="0.55" stop-color="#fff8ee"/>
      <stop offset="1" stop-color="#ffe7c4"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75503a"/>
      <stop offset="1" stop-color="#2d211d"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff526e"/>
      <stop offset="0.48" stop-color="#ff244f"/>
      <stop offset="1" stop-color="#ca0d69"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ccc4d"/>
      <stop offset="1" stop-color="#39742b"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1d2530" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1920" height="760" rx="28" fill="url(#sky)"/>
  <circle cx="1710" cy="116" r="80" fill="#ffd775" opacity="0.72"/>
  <path d="M0 380C210 300 410 350 610 318C820 284 1000 365 1210 314C1450 255 1650 330 1920 270V500H0Z" fill="#b8d5d2" opacity="0.5"/>
  <path d="M0 430C230 370 430 416 655 388C875 360 1080 430 1310 385C1550 336 1710 392 1920 348V500H0Z" fill="#91b6a0" opacity="0.38"/>

  <!-- Top identity -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#253044">
    <text x="80" y="95" font-size="44" font-weight="500">vanilla</text>
    <text x="80" y="158" font-size="74" font-weight="800">Linux 7.3</text>
    <text x="84" y="202" font-size="26" fill="#5d6878">The solid foundation from upstream Linux.</text>
  </g>

  <!-- Engineering flow -->
  <g transform="translate(560 82)" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#344054">
    <path d="M-48 52h46l-18-18m18 18-18 18" fill="none" stroke="#727b86" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(54 0)"><circle cx="0" cy="50" r="29" fill="#fff" opacity=".92"/><circle cx="0" cy="50" r="12" fill="none" stroke="#344054" stroke-width="6"/><path d="M0 15v14M0 71v14M-35 50h14M21 50h14M-25 25l10 10M15 65l10 10M25 25L15 35M-15 65l-10 10" stroke="#344054" stroke-width="6" stroke-linecap="round"/><text x="0" y="107" font-size="22" font-weight="700">Policy</text></g>
    <text x="120" y="61" font-size="31" font-weight="700">+</text>
    <g transform="translate(190 0)"><rect x="-25" y="24" width="50" height="50" rx="9" fill="#fff" stroke="#344054" stroke-width="4"/><path d="M-13 38h26M-13 50h26M-13 62h18" stroke="#344054" stroke-width="4" stroke-linecap="round"/><text x="0" y="107" font-size="22" font-weight="700">Config</text></g>
    <text x="256" y="61" font-size="31" font-weight="700">+</text>
    <g transform="translate(332 0)"><path d="M0 20l28 11v20c0 21-12 34-28 44c-16-10-28-23-28-44V31Z" fill="#fff" stroke="#344054" stroke-width="4"/><path d="M-11 54l8 9 18-23" fill="none" stroke="#344054" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="120" font-size="22" font-weight="700">Validation</text></g>
    <text x="408" y="61" font-size="31" font-weight="700">+</text>
    <g transform="translate(490 0)"><rect x="-28" y="55" width="11" height="25" rx="3" fill="#344054"/><rect x="-7" y="40" width="11" height="40" rx="3" fill="#344054"/><rect x="14" y="22" width="11" height="58" rx="3" fill="#344054"/><text x="0" y="107" font-size="22" font-weight="700">Engineering</text></g>
    <path d="M560 52h52l-19-18m19 18-19 18" fill="none" stroke="#727b86" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Giant Tulip wordmark -->
  <g transform="translate(1255 38)" filter="url(#shadow)">
    <g transform="translate(235 6)">
      <path d="M0 56C-62 31-62-21-43-58C-11-36 1-8 0 56Z" fill="#ff7192"/>
      <path d="M0 56C62 31 62-21 43-58C11-36-1-8 0 56Z" fill="#d20f68"/>
      <path d="M0 55C-31 18-20-30 0-65C20-30 31 18 0 55Z" fill="#ed245f"/>
    </g>
    <text x="0" y="205" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="194" font-weight="900" fill="url(#pink)" letter-spacing="-10">Tulip</text>
    <text x="12" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#4d5968">Built from Linux. Shaped as Tulip.</text>
  </g>

  <!-- Ground -->
  <path d="M0 485C220 463 405 500 610 478C835 452 1030 500 1260 474C1500 446 1705 493 1920 462V760H0Z" fill="url(#soil)"/>
  <path d="M0 505C225 481 418 515 630 494C850 470 1055 519 1275 490C1515 462 1720 512 1920 482" fill="none" stroke="#9a6a47" stroke-width="10" opacity=".7"/>

  <!-- LARGE TUX holding bouquet -->
  <g transform="translate(185 398)" filter="url(#shadow)">
    <!-- body -->
    <ellipse cx="0" cy="92" rx="82" ry="112" fill="#1f2a38"/>
    <ellipse cx="0" cy="111" rx="53" ry="83" fill="#f7f8f4"/>
    <!-- head -->
    <ellipse cx="0" cy="8" rx="66" ry="60" fill="#1f2a38"/>
    <ellipse cx="-22" cy="5" rx="18" ry="23" fill="#fff"/><ellipse cx="22" cy="5" rx="18" ry="23" fill="#fff"/>
    <circle cx="-17" cy="8" r="7" fill="#111"/><circle cx="17" cy="8" r="7" fill="#111"/>
    <path d="M-20 30L0 49L20 30Z" fill="#f5ae2f"/>
    <!-- feet -->
    <ellipse cx="-55" cy="195" rx="45" ry="20" fill="#f5ae2f" transform="rotate(-9 -55 195)"/>
    <ellipse cx="55" cy="195" rx="45" ry="20" fill="#f5ae2f" transform="rotate(9 55 195)"/>

    <!-- bouquet stems -->
    <g stroke="#477a31" stroke-width="6" stroke-linecap="round">
      <path d="M44 100L118 32"/><path d="M48 105L139 18"/><path d="M40 108L98 7"/><path d="M53 112L155 52"/><path d="M42 112L124 65"/>
    </g>
    <!-- bouquet leaves -->
    <g fill="url(#leaf)">
      <path d="M86 69C62 61 57 42 60 29C78 31 89 48 86 69Z"/>
      <path d="M117 57C139 48 149 31 147 18C130 20 116 38 117 57Z"/>
      <path d="M108 92C82 86 75 68 77 53C96 55 109 72 108 92Z"/>
      <path d="M139 83C159 74 168 59 166 47C151 48 138 64 139 83Z"/>
    </g>
    <!-- bouquet tulip flowers, large and obvious -->
    <g>
      <g transform="translate(98 0)"><path d="M0 29C-29 16-29-10-14-30C-4-19 0-7 0 7C0-7 4-19 14-30C29-10 29 16 0 29Z" fill="#ff405c"/><path d="M0 27C-14 12-12-11 0-34C12-11 14 12 0 27Z" fill="#ff715f"/></g>
      <g transform="translate(140 9)"><path d="M0 29C-29 16-29-10-14-30C-4-19 0-7 0 7C0-7 4-19 14-30C29-10 29 16 0 29Z" fill="#d90f68"/><path d="M0 27C-14 12-12-11 0-34C12-11 14 12 0 27Z" fill="#f02e66"/></g>
      <g transform="translate(156 50)"><path d="M0 27C-27 14-27-9-13-27C-4-17 0-6 0 6C0-6 4-17 13-27C27-9 27 14 0 27Z" fill="#ff4458"/><path d="M0 25C-13 11-11-10 0-31C11-10 13 11 0 25Z" fill="#ff765d"/></g>
      <g transform="translate(123 62)"><path d="M0 25C-25 13-25-8-12-25C-4-16 0-6 0 5C0-6 4-16 12-25C25-8 25 13 0 25Z" fill="#f3efe0"/><path d="M0 23C-12 10-10-9 0-28C10-9 12 10 0 23Z" fill="#fff9ec"/></g>
      <g transform="translate(118 21)"><path d="M0 25C-25 13-25-8-12-25C-4-16 0-6 0 5C0-6 4-16 12-25C25-8 25 13 0 25Z" fill="#ff3454"/><path d="M0 23C-12 10-10-9 0-28C10-9 12 10 0 23Z" fill="#ff6b5b"/></g>
    </g>
    <!-- paper wrap and ribbon -->
    <path d="M58 96L169 75L128 167L62 145Z" fill="#b88a59"/>
    <path d="M90 124L132 124" stroke="#c70f4f" stroke-width="9" stroke-linecap="round"/>
    <path d="M111 122L94 149M111 122L130 148" stroke="#c70f4f" stroke-width="8" stroke-linecap="round"/>
    <!-- arms over bouquet -->
    <path d="M-62 84C-32 90 1 105 48 121" fill="none" stroke="#1f2a38" stroke-width="25" stroke-linecap="round"/>
    <path d="M56 76C74 92 75 112 61 130" fill="none" stroke="#1f2a38" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Separate growth sequence: never replaces Tux -->
  <g transform="translate(650 0)">
    <!-- sprout -->
    <g transform="translate(0 505)"><path d="M0 80V24" stroke="#477a31" stroke-width="10" stroke-linecap="round"/><path d="M0 46C-47 40-58 8-55-7C-23-6-4 18 0 46Z" fill="url(#leaf)"/><path d="M0 43C44 35 54 6 50-8C21-6 4 17 0 43Z" fill="url(#leaf)"/></g>
    <!-- young plant -->
    <g transform="translate(300 445)"><path d="M0 145V28" stroke="#477a31" stroke-width="12" stroke-linecap="round"/><path d="M-2 95C-66 87-78 40-73 17C-31 24-6 59-2 95Z" fill="url(#leaf)"/><path d="M2 103C64 93 77 48 71 27C31 32 7 66 2 103Z" fill="url(#leaf)"/><path d="M0 35C-22 19-21-12 0-29C21-12 22 19 0 35Z" fill="#d84753"/></g>
    <!-- bud -->
    <g transform="translate(610 405)"><path d="M0 185V50" stroke="#477a31" stroke-width="14" stroke-linecap="round"/><path d="M-2 130C-76 121-89 67-82 39C-35 46-8 84-2 130Z" fill="url(#leaf)"/><path d="M2 138C72 126 88 74 81 48C35 54 9 93 2 138Z" fill="url(#leaf)"/><path d="M0 60C-38 37-37-29 0-59C37-29 38 37 0 60Z" fill="url(#pink)"/></g>
    <!-- full tulip -->
    <g transform="translate(930 350)" filter="url(#shadow)"><path d="M0 240V82" stroke="#3f712b" stroke-width="16" stroke-linecap="round"/><path d="M-5 185C-96 173-109 103-100 68C-43 77-10 128-5 185Z" fill="url(#leaf)"/><path d="M5 192C94 177 112 112 103 77C46 86 12 138 5 192Z" fill="url(#leaf)"/><path d="M0 104C-72 67-71-29-35-78C-11-54 0-20 0 17C0-20 11-54 35-78C71-29 72 67 0 104Z" fill="url(#pink)"/><path d="M0 101C-42 59-38-19 0-86C38-19 42 59 0 101Z" fill="#ff5b52" opacity=".9"/></g>
  </g>

  <!-- Bottom caption strip -->
  <rect x="46" y="632" width="1828" height="88" rx="23" fill="#111820" opacity=".76"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#fff">
    <g transform="translate(190 0)"><text y="668" font-size="28" font-weight="800">Upstream</text><text y="700" font-size="21" opacity=".9">Linux 7.3 foundation</text></g>
    <g transform="translate(650 0)"><text y="668" font-size="28" font-weight="800">Beginning</text><text y="700" font-size="21" opacity=".9">Tulip starts separately</text></g>
    <g transform="translate(950 0)"><text y="668" font-size="28" font-weight="800">Growing</text><text y="700" font-size="21" opacity=".9">Policy · config · validation</text></g>
    <g transform="translate(1260 0)"><text y="668" font-size="28" font-weight="800">Strengthening</text><text y="700" font-size="21" opacity=".9">Engineering · testing</text></g>
    <g transform="translate(1580 0)"><text y="668" font-size="31" font-weight="900">Tulip</text><text y="700" font-size="21" opacity=".92">Linux-derived · evidence-driven</text></g>
  </g>
</svg>