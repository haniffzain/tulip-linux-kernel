<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="760" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc">
  <title id="title">Linux 7.3 Tulip hero</title>
  <desc id="desc">Tux holds a bouquet of tulips while a separate tulip growth sequence represents Tulip policy, configuration, validation, engineering and testing growing from upstream Linux 7.3.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dceeff"/><stop offset="0.55" stop-color="#fff8ec"/><stop offset="1" stop-color="#ffe8c9"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4f67"/><stop offset="0.48" stop-color="#ff264f"/><stop offset="1" stop-color="#cc0d68"/></linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff765e"/><stop offset="0.5" stop-color="#f7364e"/><stop offset="1" stop-color="#c81355"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bcc4b"/><stop offset="1" stop-color="#377329"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74503b"/><stop offset="1" stop-color="#2c211e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c2430" flood-opacity="0.18"/></filter>
  </defs>

